name: Check JavaScript syntax

on:
  push:
    branches: [main, feature/full-messenger-platform, feature/magicpath-call-experience, fix/exact-magicpath-fps-settings, fix/fullscreen-fit-entire-screen, fix/room-presence-and-ai-noise-reduction, restore/pre-animal-magicpath-ui]
    paths:
      - "public/*.js"
      - "public/*.html"
      - "public/*.css"
      - "server.js"
      - "scripts/*.mjs"
      - ".github/workflows/check-frontend.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Validate JavaScript syntax
        run: |
          node --check public/app.js
          node --check server.js
      - name: Check UI elements and Socket.IO wiring
        run: node scripts/check-frontend.mjs
